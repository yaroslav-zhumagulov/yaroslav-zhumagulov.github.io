<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ profile.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ profile.name }}, {{ profile.title|lower }} at {{ profile.institution }}. {{ profile.tagline }}{% endblock %}">
<link rel="canonical" href="{{ profile.url }}/{% block canonical %}{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="profile">
<meta property="og:url" content="{{ profile.url }}/{{ self.canonical() }}">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ profile.name }}",
  "alternateName": {{ profile.alt_names|tojson }},
  "jobTitle": "{{ profile.title }}",
  "email": "mailto:{{ profile.email }}",
  "url": "{{ profile.url }}",
  "affiliation": {"@type": "Organization", "name": "EPFL", "url": "https://www.epfl.ch"},
  "sameAs": {{ profile.same_as|tojson }}
}
</script>
</head>
<body class="page-{{ page }}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>{{ profile.name }}</a>
  <nav class="site-nav" aria-label="Main">
    <a href="/research/" {% if page == 'research' %}aria-current="page"{% endif %}>Research</a>
    <a href="/publications/" {% if page == 'publications' %}aria-current="page"{% endif %}>Publications</a>
    <a href="/software/" {% if page == 'software' %}aria-current="page"{% endif %}>Software</a>
    <a href="/cv/" {% if page == 'cv' %}aria-current="page"{% endif %}>CV</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle colour theme" title="Toggle theme">
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>

<main id="main">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-links">
    {% for l in profile.links %}
    <a href="{{ l.href }}" {% if not l.href.startswith('mailto') %}rel="me noopener" target="_blank"{% endif %}>{{ l.label }}</a>
    {% endfor %}
  </div>
  <p class="footer-meta">© {{ build_year }} {{ profile.name }} · {{ profile.group }}, {{ profile.institution }} ·
    <a href="https://github.com/yaroslav-zhumagulov/yaroslav-zhumagulov.github.io">source</a></p>
</footer>
<script src="/static/js/site.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
