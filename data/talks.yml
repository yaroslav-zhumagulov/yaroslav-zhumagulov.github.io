# Talks page. The slides of a talk are in talks/<slug>/ and the demo in demos/<slug>/, both copied
# from the demo repository with tools/sync_demo.py; `slides` is the page the title links to.
talks:
  - slug: nm4qm-2026
    title: Spin and anomalous Hall effects with WannierBerri and GPAW
    kind: Hands-on session, 45 min
    event: "NM4QM 2026: Numerical methods for quantum matter, from nanographenes to moiré materials"
    place: DIPC, Donostia-San Sebastián
    date: 13–16 October 2026
    summary: >-
      Symmetry-adapted Wannier functions straight from GPAW, spin–orbit coupling switched on for any
      spin axis without new DFT, the spin Hall conductivity of graphene and the anomalous Hall effect
      of the altermagnet MnTe. Two notebooks that run on a laptop in a few minutes.
    slides: /talks/nm4qm-2026/
    links:
      - label: Slides
        href: /talks/nm4qm-2026/
      - label: PDF
        href: /talks/nm4qm-2026/nm4qm-2026.pdf
      - label: Notebooks and code
        href: https://github.com/yaroslav-zhumagulov/yaroslav-zhumagulov.github.io/tree/main/demos/nm4qm-2026
