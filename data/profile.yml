bio:
  - >-
    I am a postdoctoral researcher in the group of Oleg Yazyev at EPFL. I work on the
    electronic structure of two-dimensional materials, with a focus on how proximity effects,
    defects and electron correlations reshape their low-energy physics.
  - >-
    Most of my current work is methodological: representing proximity and defect couplings
    in a Wannier basis directly from plane-wave DFT, computing linear response without
    ever forming empty states, and building mean-field theories of correlated phases in
    multilayer graphene that experiments can test.
  - >-
    Before EPFL I did my PhD with Jaroslav Fabian at the University of Regensburg, where I worked on
    correlated phases in proximitized rhombohedral trilayer and Bernal bilayer graphene, with excitons
    and trions in two-dimensional semiconductors as side projects. I studied physics at MEPhI in Moscow.

interests:
  - Correlated phases in rhombohedral and Bernal multilayer graphene
  - Excitons, trions and polaritons in 2D semiconductors and magnets
  - Wannier downfolding of proximity and defect couplings
  - Magnetic order and spin response from Sternheimer linear response
  - Electronic structure of layered materials with experimental collaborators

now:
  - Wannier representation of proximity effects and the qe-downfolding package
  - Magnetic order from first-principles linear response (qe_magnon)
  - Correlated phases and magnetoelectric switching in rhombohedral graphene

