# Conda environment for the hands-on session (tested: Python 3.12, GPAW 26.7.0, irrep 3.3.0, Ray 2.44.1).
#
#   bash setup/setup.sh      # Linux, macOS, WSL2: creates it, installs WannierBerri, checks everything
name: wbdemo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - gpaw=26.7.0=*nompi*           # serial GPAW (one DFT step takes under a minute); brings its PAW datasets
  - ase>=3.29
  - numpy
  - scipy
  - numba                         # the tetrahedron method of WannierBerri
  - pyfftw                        # fast Fourier transforms for WannierBerri
  - matplotlib
  - jupyterlab
  - ipywidgets                    # else Ray and tqdm print a warning into the notebooks
  - nbconvert
  - git
  - pip
  - pip:
      - irrep==3.3.0                # 3.2 finds no altermagnetic symmetry in the GPAW 26.7 moments
      - ray[default]==2.44.1
variables:
  OMP_NUM_THREADS: 1              # one thread per process: GPAW runs 2-3 times faster than with all cores
